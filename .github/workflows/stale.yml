name: Stale Issue Manager

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please leave a comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If you're still working on this, please leave a comment to keep it open.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Feel free to
            reopen if the issue is still relevant.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. Feel free to
            reopen if you'd like to continue working on it.
          days-before-stale: 90
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "bug,enhancement,help wanted,needs-review"
          exempt-pr-labels: "needs-review,dependencies"
          operations-per-run: 100
